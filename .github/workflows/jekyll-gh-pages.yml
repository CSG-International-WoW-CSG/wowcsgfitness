# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site (skip Jekyll — avoids heavy/corrupt builds)
        run: |
          mkdir -p _site
          # Copy web assets only; keep downloads/ APKs, drop root debug APK and native project
          shopt -s dotglob nullglob
          for item in *; do
            case "$item" in
              _site|android|node_modules|.git|.github|WOW-CSG-Fitness-debug.apk|package-lock.json) continue ;;
            esac
            cp -a "$item" _site/
          done
          touch _site/.nojekyll
          # Ensure old service workers self-destruct
          printf '%s\n' \
            "self.addEventListener('install',e=>e.waitUntil(self.skipWaiting()));" \
            "self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.map(caches.delete.bind(caches)))).then(()=>self.registration.unregister())));" \
            > _site/service-worker.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Free iOS path without owning a Mac:
# 1) Primary: PWA Add to Home Screen (no build needed)
# 2) This workflow: compile Capacitor iOS on GitHub's free public macOS runners
#    (unsigned simulator build — validates the project; not installable on devices)
name: iOS build (no Mac)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/copy-www.mjs'
      - '.github/workflows/ios-build.yml'
    branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Capacitor iOS (simulator, unsigned)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor deps only
        # Skip firebase-tools/admin — they bloat CI and break npm ci lock sync.
        # Capacitor sync only needs the packages below.
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-package-lock \
            @capacitor/cli@6.2.0 \
            @capacitor/core@6.2.0 \
            @capacitor/ios@6.2.0 \
            @capacitor/android@6.2.0 \
            @capacitor/app@6.0.3 \
            @capacitor/geolocation@6.1.1 \
            @capacitor/splash-screen@6.0.4 \
            @capacitor/status-bar@6.0.3 \
            @tubbly/tubbly-capacitor-pedometer@0.0.9

      - name: Copy web assets + sync Capacitor iOS
        run: |
          npm run copy:www
          npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Show Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep -i Xcode || true

      - name: Build for iOS Simulator (no signing)
        working-directory: ios/App
        run: |
          set -euo pipefail
          if [ ! -d App.xcworkspace ]; then
            echo "App.xcworkspace missing after pod install"
            ls -la
            exit 1
          fi
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Upload simulator product
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: |
            ios/App/DerivedData/Build/Products/Debug-iphonesimulator/
          if-no-files-found: warn
          retention-days: 7

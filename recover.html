<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Repair WOW-CSG Fitness</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; line-height: 1.45; }
    .card { max-width: 420px; margin: 40px auto; padding: 24px; background: #1e293b; border-radius: 12px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { margin: 0 0 14px; color: #cbd5e1; font-size: 0.95rem; }
    button, a.btn {
      display: block; width: 100%; box-sizing: border-box; margin: 10px 0 0;
      padding: 14px 16px; border: 0; border-radius: 10px; font-size: 1rem; font-weight: 600;
      text-align: center; text-decoration: none; cursor: pointer;
    }
    button { background: #f97316; color: #111; }
    a.btn { background: #334155; color: #fff; }
    #log { margin-top: 16px; font-size: 0.85rem; color: #94a3b8; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Repair site access</h1>
    <p>Only for phones that show “Can’t open this page” or keep reloading. This clears broken offline data, then opens the normal site.</p>
    <button type="button" id="repairBtn">Clear cache &amp; reopen site</button>
    <a class="btn" href="./index.html?recovered=1">Skip — open site</a>
    <div id="log"></div>
  </div>
  <script>
    (function () {
      var logEl = document.getElementById('log');
      function log(msg) { logEl.textContent += msg + '\n'; }
      function wipeIdb() {
        try {
          if (!window.indexedDB) return Promise.resolve();
          if (typeof indexedDB.databases === 'function') {
            return indexedDB.databases().then(function (dbs) {
              return Promise.all((dbs || []).map(function (db) {
                return new Promise(function (resolve) {
                  if (!db || !db.name) return resolve();
                  var req = indexedDB.deleteDatabase(db.name);
                  req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
                });
              }));
            });
          }
          ['firebaseLocalStorageDb', 'firebase-heartbeat-database', 'firebase-installations-database'].forEach(function (name) {
            try { indexedDB.deleteDatabase(name); } catch (e0) {}
          });
        } catch (e1) {}
        return Promise.resolve();
      }
      function repair() {
        var tasks = [];
        log('Clearing…');
        try {
          [
            'stepEntries', 'stepEntries_cache', 'participants_cache', 'wowcsg_active_activity_v1',
            'wowcsg_boot_fails_v69', 'wowcsg_boot_fails_v80', 'wowcsg_boot_fails_v81'
          ].forEach(function (k) {
            try { localStorage.removeItem(k); } catch (e0) {}
            try { sessionStorage.removeItem(k); } catch (e1) {}
          });
          try { sessionStorage.clear(); } catch (e2) {}
          log('Cleared local data');
        } catch (e) { log('localStorage: ' + e); }
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () { log('Removed service workers'); }));
        }
        if (window.caches && caches.keys) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).then(function () { log('Cleared caches'); }));
        }
        tasks.push(wipeIdb().then(function () { log('Cleared offline DB'); }));
        Promise.all(tasks).then(function () {
          log('Done. Opening site…');
          setTimeout(function () { location.replace('./index.html?recovered=1'); }, 350);
        }).catch(function () {
          setTimeout(function () { location.replace('./index.html?recovered=1'); }, 700);
        });
      }
      document.getElementById('repairBtn').addEventListener('click', repair);
      if (/[?&]auto=1/.test(location.search)) {
        log('Auto-repair started…');
        setTimeout(repair, 200);
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Repair WOW-CSG Fitness</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; line-height: 1.45; }
    .card { max-width: 420px; margin: 40px auto; padding: 24px; background: #1e293b; border-radius: 12px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { margin: 0 0 14px; color: #cbd5e1; font-size: 0.95rem; }
    button, a.btn {
      display: block; width: 100%; box-sizing: border-box; margin: 10px 0 0;
      padding: 14px 16px; border: 0; border-radius: 10px; font-size: 1rem; font-weight: 600;
      text-align: center; text-decoration: none; cursor: pointer;
    }
    button { background: #f97316; color: #111; }
    a.btn { background: #334155; color: #fff; }
    #log { margin-top: 16px; font-size: 0.85rem; color: #94a3b8; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Repair site access</h1>
    <p>Use this if the challenge page opens, reloads, then shows “Can’t open this page” — even in Incognito.</p>
    <p>This clears broken offline data on the phone, then opens a <strong>tap-to-start</strong> version of the site (more stable on mobile Chrome).</p>
    <button type="button" id="repairBtn">Clear cache &amp; open (tap to start)</button>
    <a class="btn" href="./index.html?boot=tap">Skip clear — open tap-to-start</a>
    <div id="log"></div>
  </div>
  <script>
    (function () {
      var logEl = document.getElementById('log');
      function log(msg) { logEl.textContent += msg + '\n'; }
      document.getElementById('repairBtn').addEventListener('click', function () {
        var tasks = [];
        log('Clearing…');
        try {
          var keys = [];
          for (var i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
          keys.forEach(function (k) {
            if (!k) return;
            if (/stepEntries|participants|wowcsg|firebase|boot/i.test(k)) {
              localStorage.removeItem(k);
            }
          });
          sessionStorage.clear();
          log('Cleared local site data');
        } catch (e) { log('localStorage: ' + e); }
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () { log('Removed service workers'); }));
        }
        if (window.caches && caches.keys) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).then(function () { log('Cleared caches'); }));
        }
        Promise.all(tasks).then(function () {
          log('Done. Opening tap-to-start…');
          setTimeout(function () { location.replace('./index.html?boot=tap&recovered=1'); }, 350);
        }).catch(function (err) {
          log('Error: ' + err);
          setTimeout(function () { location.replace('./index.html?boot=tap&recovered=1'); }, 700);
        });
      });
    })();
  </script>
</body>
</html>

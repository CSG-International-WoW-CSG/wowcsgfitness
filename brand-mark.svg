<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="WOW-CSG Fitness">
  <defs>
    <linearGradient id="markBg" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#062a47"/>
      <stop offset="42%" stop-color="#0b6e6a"/>
      <stop offset="78%" stop-color="#e85a38"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff9f43" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff6b4a"/>
      <stop offset="70%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#062a47" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Bold squircle badge -->
  <rect x="2" y="2" width="76" height="76" rx="20" fill="url(#markBg)"/>
  <rect x="6" y="6" width="68" height="68" rx="17" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Motion rings -->
  <circle cx="40" cy="40" r="28" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2" stroke-dasharray="4 7">
    <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Speed trails -->
  <g stroke="url(#swoosh)" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M10 46 C22 38, 34 52, 48 42" stroke-width="3.5">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M12 54 C24 46, 36 58, 50 50" stroke-width="2.6" opacity="0.75">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.8s" begin="0.25s" repeatCount="indefinite"/>
    </path>
    <path d="M14 38 C26 32, 38 44, 52 34" stroke-width="2.2" opacity="0.65">
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Bold athletic runner -->
  <g fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Head -->
    <circle cx="47" cy="20" r="6.2" stroke="none"/>
    <!-- Torso lean -->
    <path d="M45 27 L38 42" fill="none" stroke-width="5.2"/>
    <!-- Front arm punch -->
    <path d="M42 31 L56 26" fill="none" stroke-width="4.4"/>
    <!-- Back arm drive -->
    <path d="M42 32 L30 40" fill="none" stroke-width="4.2"/>
    <!-- Lead leg stride -->
    <path d="M38 42 L52 58" fill="none" stroke-width="5"/>
    <!-- Trail leg kick -->
    <path d="M38 42 L26 56" fill="none" stroke-width="5"/>
    <!-- Running shoe accents -->
    <path d="M50 58 L58 60" fill="none" stroke-width="3.8" stroke="#ffd4a8"/>
    <path d="M24 56 L18 58" fill="none" stroke-width="3.4" stroke="#ffd4a8"/>
  </g>

  <!-- Energy bolt (fitness power) -->
  <path d="M58 28 L52 40 L56 40 L50 52 L64 36 L58 36 Z" fill="#ffd166">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Footstep pulse dots -->
  <circle cx="22" cy="64" r="2.4" fill="#ff9f43">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="31" cy="66" r="2.4" fill="#2dd4bf">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" begin="0.28s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="64" r="2.4" fill="#fff">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" begin="0.56s" repeatCount="indefinite"/>
  </circle>
</svg>
